<div class="card shadow-sm mt-4">
  <div class="card-header bg-primary text-white">
    <h3 class="card-title mb-0">Neues Parfüm hinzufügen ➕</h3>
  </div>
  <div class="card-body">
    <form (ngSubmit)="speichern()">
      
      <div class="mb-3">
        <label for="name" class="form-label">Parfümname</label>
        <input type="text" id="name" class="form-control" name="name" [(ngModel)]="neuesParfuem.name" required>
      </div>

      <div class="mb-3">
        <label for="marke" class="form-label">Marke</label>
        <input type="text" id="marke" class="form-control" name="marke" [(ngModel)]="neuesParfuem.marke" required>
      </div>

      <div class="mb-4">
        <label for="preis" class="form-label">Preis (€)</label>
        <input type="number" id="preis" class="form-control" name="preis" [(ngModel)]="neuesParfuem.preis" required>
      </div>

      <div class="d-flex gap-2">
        <button type="submit" class="btn btn-success">Speichern (حفظ)</button>
        <a routerLink="/table" class="btn btn-secondary">Abbrechen (إلغاء)</a>
      </div>
      
    </form>
  </div>
</div>
