<div class="card shadow-sm">
  <div class="card-header bg-dark text-white">
    <h3 class="card-title mb-0">Verfügbare Parfüms 🌸</h3>
  </div>
  <div class="card-body">
    <table class="table table-striped table-hover align-middle">
      <thead class="table-dark">
        <tr>
          <th>Parfümname</th>
          <th>Marke</th>
          <th>Preis</th>
          <th>Aktion</th>
        </tr>
      </thead>

      <tbody>
        <tr *ngFor="let p of parfuems">
          <td><strong>{{ p.name }}</strong></td>
          <td><span class="badge bg-secondary">{{ p.marke }}</span></td>
          <td><span class="text-success fw-bold">{{ p.preis }} €</span></td>
          <td>
            <a [routerLink]="['/detail', p._id]" class="btn btn-sm btn-outline-primary">✏️ Edit</a>
          </td>
          <td>
            <button class="btn btn-sm btn-outline-danger" (click)="deleteParfuem(p._id)">🗑️ Löschen</button>
          </td>
        </tr>
        <tr *ngIf="parfuems.length === 0">
          <td colspan="3" class="text-center text-muted p-4">
            Keine Parfüms verfügbar. Bitte überprüfen Sie die Backend-Verbindung!
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
